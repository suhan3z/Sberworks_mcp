[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sberworks-mcp"
version = "0.1.0"
description = "MCP server for Jira, Confluence and Bitbucket Server/Data Center"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "mcp[cli]>=1.9.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
]

[project.scripts]
sberworks-mcp = "sberworks_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
